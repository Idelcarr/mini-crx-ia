name: Build CRX IA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Compilar APK Debug
        run: |
          cd android_app
          gradle assembleDebug --no-daemon --stacktrace

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CRX_IA_Drone_Auditor_v1.apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk